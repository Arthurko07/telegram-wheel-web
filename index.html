<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>iGadget Wheel Debug</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      background: #3b82f6;
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin-top:0;">iGadget Wheel Debug</h1>
    <p>Эта версия показывает, что реально приходит из Telegram Mini App.</p>
  </div>

  <div class="card">
    <button id="spinBtn">Проверить Telegram initData</button>
  </div>

  <div class="card">
    <h3>Данные Telegram</h3>
    <pre id="debugBox">Загрузка...</pre>
  </div>

  <div class="card">
    <h3>Ответ backend</h3>
    <pre id="backendBox">Пока пусто</pre>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const debugBox = document.getElementById('debugBox');
    const backendBox = document.getElementById('backendBox');
    const spinBtn = document.getElementById('spinBtn');

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function collectDebug() {
      const initData = tg && tg.initData ? tg.initData : '';
      const unsafe = tg && tg.initDataUnsafe ? tg.initDataUnsafe : null;
      const user = unsafe && unsafe.user ? unsafe.user : null;

      return {
        hasTelegramObject: !!tg,
        initDataExists: !!initData,
        initDataLength: initData ? initData.length : 0,
        initDataPreview: initData ? initData.slice(0, 300) : '',
        hasInitDataUnsafe: !!unsafe,
        hasUser: !!user,
        user: user || null,
        rawUnsafe: unsafe || null
      };
    }

    function renderDebug() {
      const data = collectDebug();
      debugBox.textContent = JSON.stringify(data, null, 2);
    }

    async function testBackend() {
      const initData = tg && tg.initData ? tg.initData : '';

      try {
        const response = await fetch('https://telegram-wheel-bot-production-764c.up.railway.app/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            init_data: initData
          })
        });

        const result = await response.json();
        backendBox.textContent = JSON.stringify(result, null, 2);
      } catch (e) {
        backendBox.textContent = JSON.stringify({
          error: String(e)
        }, null, 2);
      }
    }

    spinBtn.addEventListener('click', async () => {
      renderDebug();
      await testBackend();
    });

    renderDebug();
  </script>
</body>
</html>
