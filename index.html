<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>iGadget Wheel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #16a34a;
      --primary-2: #15803d;
      --danger: #dc2626;
      --border: rgba(0,0,0,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #22c55e;
      --primary-2: #16a34a;
      --danger: #ef4444;
      --border: rgba(255,255,255,.10);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .25s ease, color .25s ease;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .hero {
      text-align: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .wheel-box {
      position: relative;
      margin: 18px auto 12px;
      width: 320px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
    }

    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid var(--danger);
      z-index: 5;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.18));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .center-btn {
      position: absolute;
      inset: 50%;
      transform: translate(-50%, -50%);
      width: 94px;
      height: 94px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, var(--primary), var(--primary-2));
      color: white;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      z-index: 6;
      box-shadow: 0 10px 20px rgba(34, 197, 94, .28);
    }

    .center-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      margin-top: 14px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      min-height: 48px;
      color: var(--muted);
    }

    .result {
      margin-top: 18px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .prize {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .desc {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .code-box {
      background: rgba(34, 197, 94, .08);
      border: 1px dashed rgba(34, 197, 94, .45);
      color: var(--text);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }

    .code-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .code {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      word-break: break-word;
    }

    .expires {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .cooldown {
      margin-top: 18px;
      display: none;
    }

    .cooldown.show {
      display: block;
    }

    .cooldown h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .timer {
      margin-top: 12px;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      color: var(--primary);
    }

    .muted-center {
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    .small-note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1 class="title">Колесо бонусов</h1>
      <p class="subtitle">
        Крутите колесо и получайте бонусы, скидки и подарки от iGadget.
      </p>
    </div>

    <div class="card">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
        <button id="spinBtn" class="center-btn">КРУТИТЬ</button>
      </div>

      <div class="status" id="status">Нажмите кнопку в центре, чтобы испытать удачу.</div>

      <div class="result" id="resultBox">
        <h2>Ваш приз</h2>
        <div class="prize" id="resultPrize">—</div>
        <div class="desc" id="resultDesc">—</div>

        <div class="code-box">
          <div class="code-label">Покажите этот код сотруднику:</div>
          <div class="code" id="resultCode">—</div>
        </div>

        <div class="expires" id="resultExpires">—</div>

        <div class="actions">
          <button class="btn btn-primary" id="copyBtn">Скопировать код</button>
          <button class="btn btn-secondary" id="closeBtn">Закрыть</button>
        </div>
      </div>

      <div class="cooldown" id="cooldownBox">
        <h2>Сегодня вы уже крутили колесо</h2>
        <div class="muted-center" id="cooldownText">
          Следующая попытка будет доступна позже.
        </div>
        <div class="timer" id="timer">--:--:--</div>
        <div class="small-note" id="lastPrizeText"></div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_BASE = "https://YOUR-BACKEND-URL.railway.app";

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const statusEl = document.getElementById("status");

    const resultBox = document.getElementById("resultBox");
    const resultPrize = document.getElementById("resultPrize");
    const resultDesc = document.getElementById("resultDesc");
    const resultCode = document.getElementById("resultCode");
    const resultExpires = document.getElementById("resultExpires");
    const copyBtn = document.getElementById("copyBtn");
    const closeBtn = document.getElementById("closeBtn");

    const cooldownBox = document.getElementById("cooldownBox");
    const cooldownText = document.getElementById("cooldownText");
    const timerEl = document.getElementById("timer");
    const lastPrizeText = document.getElementById("lastPrizeText");

    let prizes = [];
    let currentRotation = 0;
    let isSpinning = false;
    let countdownInterval = null;

    function applyTelegramTheme() {
      const scheme = tg.colorScheme || "light";
      document.body.classList.toggle("dark", scheme === "dark");

      if (tg.themeParams?.bg_color) {
        tg.setBackgroundColor?.(tg.themeParams.bg_color);
      }
      if (tg.themeParams?.header_bg_color) {
        tg.setHeaderColor?.(tg.themeParams.header_bg_color);
      }
    }

    applyTelegramTheme();
    tg.onEvent("themeChanged", applyTelegramTheme);

    function prizeColor(index, total) {
      const paletteLight = ["#22c55e", "#0ea5e9", "#f59e0b", "#ef4444", "#8b5cf6", "#14b8a6", "#eab308", "#f97316"];
      const paletteDark = ["#16a34a", "#0284c7", "#d97706", "#dc2626", "#7c3aed", "#0f766e", "#ca8a04", "#ea580c"];
      const palette = document.body.classList.contains("dark") ? paletteDark : paletteLight;
      return palette[index % palette.length];
    }

    function drawWheel(items, rotationDeg = 0) {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 8;

      ctx.clearRect(0, 0, size, size);

      if (!items.length) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#d1d5db";
        ctx.fill();
        return;
      }

      const total = items.length;
      const arc = (Math.PI * 2) / total;
      const rotationRad = rotationDeg * Math.PI / 180;

      for (let i = 0; i < total; i++) {
        const start = -Math.PI / 2 + rotationRad + i * arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = prizeColor(i, total);
        ctx.fill();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px Inter, Arial, sans-serif";
        const label = items[i].short || items[i].title || "Приз";
        ctx.fillText(label, radius - 22, 6);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(center, center, 44, 0, Math.PI * 2);
      ctx.fillStyle = document.body.classList.contains("dark") ? "#0b1220" : "#ffffff";
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = document.body.classList.contains("dark") ? "#1f2937" : "#e5e7eb";
      ctx.stroke();
    }

    async function loadPrizes() {
      const res = await fetch(`${API_BASE}/prizes`);
      const data = await res.json();

      if (!data.ok || !data.items?.length) {
        throw new Error("Не удалось загрузить призы");
      }

      prizes = data.items;
      drawWheel(prizes, currentRotation);
    }

    function findPrizeIndexById(prizeId) {
      return prizes.findIndex(p => Number(p.id) === Number(prizeId));
    }

    function animateSpinToPrize(prizeId) {
      return new Promise((resolve) => {
        const index = findPrizeIndexById(prizeId);
        if (index < 0) {
          resolve();
          return;
        }

        const count = prizes.length;
        const slice = 360 / count;

        const targetCenter = index * slice + slice / 2;
        const pointerAt = 0;
        const finalRotation = (360 * 6) + (360 - targetCenter + pointerAt);

        const start = performance.now();
        const duration = 4800;
        const from = currentRotation;
        const to = currentRotation + finalRotation;

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function frame(now) {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeOutCubic(progress);
          const value = from + (to - from) * eased;

          drawWheel(prizes, value);

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            currentRotation = value % 360;
            drawWheel(prizes, currentRotation);
            resolve();
          }
        }

        requestAnimationFrame(frame);
      });
    }

    function showResult(data) {
      cooldownBox.classList.remove("show");
      resultBox.classList.add("show");

      resultPrize.textContent = data.prize_title || "Ваш приз";
      resultDesc.textContent = data.prize_description || "";
      resultCode.textContent = data.code || "—";
      resultExpires.textContent = data.expires_at_text
        ? `Действует до: ${data.expires_at_text}`
        : "Срок действия уточняйте у сотрудника.";

      statusEl.textContent = "Поздравляем! Ваш приз уже сохранён.";
    }

    function getNextMidnightMSK() {
      const now = new Date();
      const moscowNow = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Moscow" }));
      const next = new Date(moscowNow);
      next.setHours(24, 0, 0, 0);
      return next.getTime() - moscowNow.getTime();
    }

    function formatMs(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(total / 3600)).padStart(2, "0");
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function startCooldown(data) {
      resultBox.classList.remove("show");
      cooldownBox.classList.add("show");

      cooldownText.textContent = data.error || "Сегодня вы уже использовали попытку.";
      lastPrizeText.textContent = data.last_code
        ? `Ваш прошлый выигрыш: ${data.last_prize_title} · код ${data.last_code}`
        : "";

      if (countdownInterval) {
        clearInterval(countdownInterval);
      }

      function tick() {
        const left = getNextMidnightMSK();
        timerEl.textContent = formatMs(left);
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    async function spinWheel() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      resultBox.classList.remove("show");
      cooldownBox.classList.remove("show");
      statusEl.textContent = "Проверяем попытку и крутим колесо...";

      try {
        const res = await fetch(`${API_BASE}/spin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            init_data: tg.initData || ""
          })
        });

        const data = await res.json();

        if (!data.ok && data.cooldown) {
          statusEl.textContent = "Попытка на сегодня уже использована.";
          startCooldown(data);
          return;
        }

        if (!data.ok) {
          statusEl.textContent = data.error || "Произошла ошибка.";
          return;
        }

        await animateSpinToPrize(data.prize_id);
        showResult(data);
      } catch (e) {
        statusEl.textContent = "Ошибка соединения с сервером.";
      } finally {
        isSpinning = false;
        spinBtn.disabled = false;
      }
    }

    spinBtn.addEventListener("click", spinWheel);

    copyBtn.addEventListener("click", async () => {
      const code = resultCode.textContent.trim();
      if (!code || code === "—") return;

      try {
        await navigator.clipboard.writeText(code);
        statusEl.textContent = "Код скопирован.";
        tg.HapticFeedback?.notificationOccurred("success");
      } catch (e) {
        statusEl.textContent = "Не удалось скопировать код.";
      }
    });

    closeBtn.addEventListener("click", () => {
      tg.close();
    });

    loadPrizes().catch(() => {
      statusEl.textContent = "Не удалось загрузить список призов.";
    });
  </script>
</body>
</html>
